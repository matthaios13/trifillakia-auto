# Ρυθμίσεις Trifillakia auto-poster
# Μπορείς να αλλάξεις ό,τι θέλεις εδώ μέσα από το GitHub (κουμπί ✏️) χωρίς να αγγίξεις κώδικα.

# Κάνε το true όταν βάλεις όλα τα secrets. Μέχρι τότε δεν γίνεται καμία αυτόματη ανάρτηση.
active: true

source:
  channel_url: "https://www.youtube.com/@microneuro/videos"
  credit: "🎥 Πηγή: @microneuro"
  sport: football            # football ή basketball (καθορίζει τα hashtags)
  # Εξαιρεί τις πιο πρόσφατες σεζόν (1 = μόνο τη φετινή, 2 = φετινή + περσινή κ.ο.κ.)
  exclude_recent_seasons: 1
  # Σειρά προτεραιότητας (βλ. src/catalog.py):
  #   1. νίκες σε Ευρώπη  2. νίκες σε πρωτάθλημα/κύπελλο  3. νίκες σε φιλικά
  #   4. ευρωπαϊκά ματς με ισοπαλία/ήττα  5. όλα τα υπόλοιπα
  # Μέγιστη διάρκεια βίντεο-πηγή σε δευτερόλεπτα (Shorts έως 3 λεπτά μαζί με το outro)
  max_seconds: 170

# Πόσες μέρες μπροστά ετοιμάζει το Mac (7 μέρες x 3 = 21 βίντεο)
queue:
  days_ahead: 7

# Ώρες Ελλάδας
schedule:
  timezone: "Europe/Athens"
  slots: ["10:00", "14:00", "19:00"]
  # Αν το GitHub αργήσει, μέχρι πόσες ώρες μετά την ώρα του slot επιτρέπεται η ανάρτηση
  grace_hours: 3

hashtags:
  football: "#paofc #panathinaikos #panathinaikosfc #ucl #championsleague #football #elabet #elaoposeisai #trifillakiagr"
  basketball: "#paobc #panathinaikos #panathinaikosbc #paobcaktor #euroleague #basketball #elabet #elaoposeisai #trifillakiagr"

# Μπαίνει στο τέλος κάθε περιγραφής (πριν τα hashtags)
footer: "🔞 21+ | Παίξε υπεύθυνα"

publish:
  instagram: true
  # YouTube: ανεβαίνει ΠΑΝΤΑ πρώτα ιδιωτικό. Μετά από youtube_review_minutes λεπτά ελέγχεται:
  # αν δεν έχει απορριφθεί/μπλοκαριστεί για copyright γίνεται δημόσιο, αλλιώς μένει ιδιωτικό
  # και έρχεται email. Με youtube_auto_public: false μένουν όλα ιδιωτικά (τα κάνεις εσύ δημόσια).
  youtube: true
  youtube_auto_public: true
  youtube_review_minutes: 30
  # Hashtags στο τέλος του τίτλου των Shorts
  youtube_title_hashtags: "#elaoposeisai #shorts #panathinaikos"
  # Σήμανση «Περιέχει πληρωμένη προώθηση» (χορηγία Elabet) — απαιτείται από το YouTube
  youtube_paid_promotion: true

# ---------------------------------------------------------------------------------------------
# Shorts από κοινόχρηστο φάκελο Google Drive (src/drive_shorts.py, workflow drive.yml)
# Όποιος ρίχνει βίντεο σε υποφάκελο εκπομπής → outro Elabet → ΑΜΕΣΩΣ σε Instagram + YouTube.
# Ο φάκελος ορίζεται από τη μεταβλητή DRIVE_FOLDER_ID στο GitHub (τη βάζει το setup_drive.py).
drive_shorts:
  active: true
  max_seconds: 170
  follow: "📲 Instagram & X: @trifillakiagr | YouTube: @trifillakia_gr | Facebook: trifillakia.gr"
  # Αν ο τίτλος (όνομα αρχείου) έχει λέξεις όπως «μπάσκετ/BC/EuroLeague» ή «ποδόσφαιρο/FC»,
  # μπαίνουν τα αντίστοιχα hashtags· αλλιώς ό,τι ορίζει το sport της εκπομπής (both = και τα δύο).
  sport_hashtags:
    football: "#paofc #panathinaikos #panathinaikosfc #football"
    basketball: "#paobc #panathinaikos #panathinaikosbc #paobcaktor #euroleague #basketball"
    both: "#panathinaikos #paofc #paobc"
  # folder = όνομα υποφακέλου στο Drive (τα φτιάχνει το setup_drive.py)
  shows:
    ROI_MAT_SHOW:       {folder: "ROI MAT SHOW",            name: "ROI MAT SHOW",            hashtag: "#roimatshow",        sport: both}
    PITCH_TALK:         {folder: "PITCH TALK",              name: "Pitch Talk",              hashtag: "#pitchtalk",         sport: both}
    PAO_INSIDE:         {folder: "PAO INSIDE",              name: "PAO INSIDE",              hashtag: "#paoinside",         sport: both}
    GREEN_VOICE:        {folder: "GREEN VOICE",             name: "Green Voice",             hashtag: "#greenvoice",        sport: both}
    13_SHADES_OF_GREEN: {folder: "13 SHADES OF GREEN",      name: "13 Shades of Green",      hashtag: "#13shadesofgreen",   sport: football}
    2_AND_A_HALF_STEPS: {folder: "2 AND A HALF STEPS",      name: "2 and a Half Steps",      hashtag: "#2andahalfsteps",    sport: basketball}
    PAO_LEGENDS:        {folder: "PAO LEGENDS",             name: "PAO Legends",             hashtag: "#paolegends",        sport: both}
    PAO_UNFILTERED:     {folder: "PAO UNFILTERED",          name: "PAO Unfiltered",          hashtag: "#paounfiltered",     sport: both}
    PAO_PLAYBOOK:       {folder: "PAO PLAYBOOK",            name: "PAO Playbook",            hashtag: "#paoplaybook",       sport: both}
    TRIFYLLI_TALK:      {folder: "TRIFYLLI TALK",           name: "Trifylli Talk",           hashtag: "#trifyllitalk",      sport: both}
    THE_GREEN_VIEW:     {folder: "THE GREEN VIEW",          name: "The Green View",          hashtag: "#thegreenview",      sport: both}
    THE_GREEN_ROOM:     {folder: "THE GREEN ROOM",          name: "The Green Room",          hashtag: "#thegreenroom",      sport: both}
    PRASINI_MATIA:      {folder: "ΠΡΑΣΙΝΗ ΜΑΤΙΑ",           name: "Πράσινη Ματιά",           hashtag: "#prasinimatia",      sport: both}
    EUROLEAGUE_GREEN_ZONE: {folder: "EUROLEAGUE GREEN ZONE", name: "EuroLeague Green Zone",  hashtag: "#euroleaguegreenzone", sport: basketball}
    PAO_EUROPEAN_PULSE: {folder: "PAO EUROPEAN PULSE",      name: "PAO European Pulse",      hashtag: "#paoeuropeanpulse",  sport: both}
