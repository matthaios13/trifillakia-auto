# Ρυθμίσεις Trifillakia auto-poster
# Μπορείς να αλλάξεις ό,τι θέλεις εδώ μέσα από το GitHub (κουμπί ✏️) χωρίς να αγγίξεις κώδικα.

# Κάνε το true όταν βάλεις όλα τα secrets. Μέχρι τότε δεν γίνεται καμία αυτόματη ανάρτηση.
active: true

source:
  channel_url: "https://www.youtube.com/@microneuro/videos"
  credit: "🎥 Πηγή: @microneuro"
  sport: football            # football ή basketball (καθορίζει τα hashtags)
  # Εξαιρεί τις πιο πρόσφατες σεζόν (1 = μόνο τη φετινή, 2 = φετινή + περσινή κ.ο.κ.)
  exclude_recent_seasons: 1
  # Σειρά προτεραιότητας (βλ. src/catalog.py):
  #   1. νίκες σε Ευρώπη  2. νίκες σε πρωτάθλημα/κύπελλο  3. νίκες σε φιλικά
  #   4. ευρωπαϊκά ματς με ισοπαλία/ήττα  5. όλα τα υπόλοιπα
  # Μέγιστη διάρκεια βίντεο-πηγή σε δευτερόλεπτα (Shorts έως 3 λεπτά μαζί με το outro)
  max_seconds: 170

# Πόσες μέρες μπροστά ετοιμάζει το Mac (7 μέρες x 3 = 21 βίντεο)
queue:
  days_ahead: 7

# Ώρες Ελλάδας
schedule:
  timezone: "Europe/Athens"
  slots: ["10:00", "14:00", "19:00"]
  # Αν το GitHub αργήσει, μέχρι πόσες ώρες μετά την ώρα του slot επιτρέπεται η ανάρτηση
  grace_hours: 3

hashtags:
  football: "#paofc #panathinaikos #panathinaikosfc #ucl #championsleague #football #elabet #elaoposeisai #trifillakiagr"
  basketball: "#paobc #panathinaikos #panathinaikosbc #paobcaktor #euroleague #basketball #elabet #elaoposeisai #trifillakiagr"

# Μπαίνει στο τέλος κάθε περιγραφής (πριν τα hashtags)
footer: "🔞 21+ | Παίξε υπεύθυνα"

publish:
  instagram: true
  # YouTube: ανεβαίνει ΠΑΝΤΑ πρώτα ιδιωτικό. Μετά από youtube_review_minutes λεπτά ελέγχεται:
  # αν δεν έχει απορριφθεί/μπλοκαριστεί για copyright γίνεται δημόσιο, αλλιώς μένει ιδιωτικό
  # και έρχεται email. Με youtube_auto_public: false μένουν όλα ιδιωτικά (τα κάνεις εσύ δημόσια).
  youtube: false
  youtube_auto_public: true
  youtube_review_minutes: 30
  # Hashtags στο τέλος του τίτλου των Shorts
  youtube_title_hashtags: "#elaoposeisai #shorts #panathinaikos"
  # Σήμανση «Περιέχει πληρωμένη προώθηση» (χορηγία Elabet) — απαιτείται από το YouTube
  youtube_paid_promotion: true
