name: Trifillakia auto-post

on:
  schedule:
    # Τρέχει κάθε 30' (ώρα UTC 06-18). Το πρόγραμμα αποφασίζει μόνο του αν είναι ώρα ανάρτησης
    # (10:00, 14:00, 19:00 Ελλάδας, από το config.yaml), οπότε δουλεύει και με θερινή/χειμερινή ώρα.
    - cron: "*/30 6-18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal / force (ανάρτηση τώρα) / dry-run (μόνο δοκιμαστικό βίντεο)"
        default: dry-run
        type: choice
        options: [normal, force, dry-run]

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Cookies YouTube (προαιρετικό)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          case "$MODE" in
            force)   python src/main.py --force ;;
            dry-run) python src/main.py --dry-run ;;
            *)       python src/main.py ;;
          esac

      - name: Αποθήκευση βίντεο για έλεγχο
        if: always() && hashFiles('output/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/
          retention-days: 7

      - name: Αποθήκευση ιστορικού
        if: always()
        run: |
          git config user.name "trifillakia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Ιστορικό αναρτήσεων & κατάλογος" && git push)
