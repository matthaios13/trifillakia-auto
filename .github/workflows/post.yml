name: Trifillakia auto-post

on:
  schedule:
    # Ελέγχει μόνο γύρω από τις ώρες ανάρτησης (10:00, 14:00, 19:00 Ελλάδας = 07/08, 11/12, 16/17 UTC
    # ανάλογα με θερινή/χειμερινή ώρα), ώστε να μένουμε άνετα στα δωρεάν λεπτά του GitHub.
    # Αν αλλάξεις τις ώρες στο config.yaml, άλλαξε και αυτή τη γραμμή.
    - cron: "5,35 7,8,11,12,16,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal / force (ανάρτηση τώρα του επόμενου βίντεο της ουράς)"
        default: normal
        type: choice
        options: [normal, force]

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Είναι ώρα ανάρτησης;
        id: check
        run: |
          if [ "${{ github.event.inputs.mode }}" = "force" ]; then echo "due=true" >> "$GITHUB_OUTPUT";
          else python src/main.py --check; fi

      # Η ουρά (branch "queue") κατεβαίνει χωρίς τα βίντεο· παίρνουμε μόνο αυτό που θα ανέβει.
      - uses: actions/checkout@v4
        if: steps.check.outputs.due == 'true'
        with:
          ref: queue
          path: queue
          filter: blob:none
          sparse-checkout: |
            /*.json
          sparse-checkout-cone-mode: false

      - if: steps.check.outputs.due == 'true'
        run: pip install requests google-api-python-client google-auth

      - name: Ανάρτηση
        if: steps.check.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "force" ]; then python -u src/main.py --force;
          else python -u src/main.py; fi

      - name: Αποθήκευση ιστορικού
        if: always() && steps.check.outputs.due == 'true'
        run: |
          git config user.name "trifillakia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "Ιστορικό αναρτήσεων" && git pull --rebase -q && git push)
